<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>

    <link rel="stylesheet" href="css/variable.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/hero.css" />
</head>
<body>
    <!--
  sections/navbar.html
  PURPOSE : Navigation bar markup.
            Contains the logo (your initials) on the left and
            navigation links on the right.
  LINKED CSS : css/navbar.css
-->

<nav>

  <!-- LOGO: Your initials displayed in the top-left corner -->
  <!-- ✏️ CHANGE: Replace "YN" with your actual initials -->
  <span class="nav-logo">RK</span>

  <!-- NAV LINKS: Anchor links that jump to each section -->
  <!-- The href="#home" matches id="home" on the section element -->
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>

</nav>
<!--
  sections/hero.html
  PURPOSE : Hero section — the first thing visitors see.
            Full-screen height with your name, title, bio,
            and two call-to-action buttons.
  LINKED CSS : css/hero.css
-->

<!-- id="home" is used by the nav link href="#home" to scroll here -->
<section id="home">

  <div class="hero-content">

    <!-- Small greeting text above the name -->
    <p class="hero-greeting">Hello, I'm</p>

    <!-- YOUR FULL NAME — the biggest text on the page -->
    <!-- ✏️ CHANGE: Replace with your full name -->
    <h1 class="hero-name">Rimsha Kousar</h1>

    <!-- YOUR ROLE OR JOB TITLE -->
    <!-- ✏️ CHANGE: e.g. "Front-End Developer", "Web Design Intern" -->
    <p class="hero-title">Web Developer &amp; Designer</p>

    <!-- SHORT BIO: 1-2 sentences about yourself -->
    <!-- ✏️ CHANGE: Write something personal about you -->
    <p class="hero-desc">
      A passionate front-end developer focused on building clean,
      user-friendly websites and digital experiences.
    </p>

    <!-- CALL-TO-ACTION BUTTONS -->
    <!-- btn-primary: main action (scrolls to contact) -->
    <!-- btn-secondary: secondary action (scrolls to about) -->
    <div>
      <a href="#contact" class="btn btn-primary">Hire Me</a>
      <a href="#about"   class="btn btn-secondary">About Me</a>
    </div>

  </div>

</section>

</body>
</html>
