<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
</head>
<body>
    <!--
  sections/navbar.html
  PURPOSE : Navigation bar markup.
            Contains the logo (your initials) on the left and
            navigation links on the right.
  LINKED CSS : css/navbar.css
-->

<nav>

  <!-- LOGO: Your initials displayed in the top-left corner -->
  <!-- ✏️ CHANGE: Replace "YN" with your actual initials -->
  <span class="nav-logo">RK</span>

  <!-- NAV LINKS: Anchor links that jump to each section -->
  <!-- The href="#home" matches id="home" on the section element -->
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>

</nav>

</body>
</html>
